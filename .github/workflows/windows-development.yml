name: Windows development verification
on:
  push:
    branches: [develop/p001]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]')
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      module_sha: ${{ steps.module.outputs.sha }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure pinned JUCE and core
        run: cmake -S . -B build -A x64 -DCYBERATOR_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Core and native processor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve editor screenshots even on test failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CYBERATOR-editor-evidence
          path: build/CYBERATOR-editor-*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Verify development bundle
        id: module
        shell: pwsh
        run: |
          $module = Get-ChildItem -Path build -Recurse -File -Filter '*.vst3' | Where-Object { $_.FullName -match 'x86_64-win' }
          if (@($module).Count -ne 1) { throw "Expected exactly one Windows VST3 module" }
          $sha = (Get-FileHash $module.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Module SHA256 $sha"
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CYBERATOR-development-not-release
          path: build/Cyberator_artefacts/Release/VST3/*.vst3/
          if-no-files-found: error
          retention-days: 14
      - name: Measure paced single and four instance actual VST3
        shell: pwsh
        run: |
          $module = @(Get-ChildItem build -Recurse -File -Filter '*.vst3' | Where-Object { $_.FullName -match 'x86_64-win' })
          $hostExe = @(Get-ChildItem build -Recurse -File -Filter 'vst3_host_test.exe')
          if ($module.Count -ne 1 -or $hostExe.Count -ne 1) { throw 'Missing exact built VST3 or RT host' }
          Push-Location build
          try {
            & $hostExe[0].FullName $module[0].FullName rt
            if ($LASTEXITCODE -ne 0) { throw 'Paced RT gate not passed; see actual duration and completion counts' }
          } finally { Pop-Location }
      - name: Retain paced realtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CYBERATOR-paced-RT-evidence
          path: build/CYBERATOR-rt-*.csv
          if-no-files-found: warn
          retention-days: 14

  independent:
    needs: windows
    if: ${{ always() && needs.windows.outputs.module_sha != '' && needs.windows.outputs.artifact_id != '' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify]')) }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Download exact same-run VST3 artifact (no product rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CYBERATOR-development-not-release
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: exact-product
      - name: Pin input bytes and provenance
        env:
          EXPECTED_MODULE_SHA: ${{ needs.windows.outputs.module_sha }}
          PRODUCT_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $bundles = @(Get-ChildItem exact-product -Directory -Recurse -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one bundle" }
          $modules = @(Get-ChildItem $bundles[0].FullName -File -Recurse -Filter '*.vst3')
          if ($modules.Count -ne 1) { throw "Expected exactly one module" }
          $hash = (Get-FileHash $modules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_MODULE_SHA) { throw "Same-run binary mismatch" }
          "PRODUCT_BUNDLE=$($bundles[0].FullName)" >> $env:GITHUB_ENV
          [ordered]@{
            product_commit=$env:GITHUB_SHA
            run_id=[long]$env:GITHUB_RUN_ID
            artifact_id=[long]$env:PRODUCT_ARTIFACT_ID
            module_sha256=$hash
            lab_commit='7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c'
            sdk_commit='3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96'
            physical_asio='NOT RUN'
            release_approved=$false
          } | ConvertTo-Json | Set-Content evidence/provenance.json
      - name: Checkout independent Test Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: challanger2000/125A-Plugin-Test-Lab
          ref: 7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c
          path: independent-lab
          persist-credentials: false
      - name: Build native independent hosts
        shell: pwsh
        run: |
          cmake -S independent-lab -B lab-build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Lab configure failed' }
          $sdk = (git -C lab-build/_deps/vst3sdk-src rev-parse HEAD).Trim()
          if ($sdk -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw 'SDK pin mismatch' }
          cmake --build lab-build --config Release --parallel 2 --target TestLabHost TestLabGUI TestLabStateStress
          if ($LASTEXITCODE -ne 0) { throw 'Lab build failed' }
      - name: Build official Steinberg validator from same SDK (C++17)
        shell: pwsh
        run: |
          cmake -S lab-build/_deps/vst3sdk-src -B validator-build -A x64 -DCMAKE_CXX_STANDARD=17 -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Validator configure failed' }
          cmake --build validator-build --config Release --parallel 2 --target validator
          if ($LASTEXITCODE -ne 0) { throw 'Validator build failed' }
      - name: Independent validation and technical baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          function UniqueExe([string]$root,[string]$name) {
            $matches = @(Get-ChildItem $root -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) { throw "Expected one $name in $root" }
            return $matches[0].FullName
          }
          $validator=UniqueExe validator-build 'validator.exe'
          $audio=UniqueExe lab-build '125A_Test_Lab_Host.exe'
          $gui=UniqueExe lab-build '125A_Test_Lab_GUI.exe'
          $stress=UniqueExe lab-build '125A_Test_Lab_State_Stress.exe'
          Get-FileHash @($validator,$audio,$gui,$stress) -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/host-hashes.json
          & $validator $env:PRODUCT_BUNDLE 2>&1 | Tee-Object evidence/validator.log
          $validatorExit=$LASTEXITCODE
          $summary=[regex]::Match((Get-Content evidence/validator.log -Raw),'Result:\s+(\d+)\s+tests passed,\s+(\d+)\s+tests failed')
          $validatorPass=$validatorExit -eq 0 -and $summary.Success -and [int]$summary.Groups[1].Value -gt 0 -and [int]$summary.Groups[2].Value -eq 0
          python independent-lab/tests/run_universal_qa.py --plugin $env:PRODUCT_BUNDLE --gui-host $gui --audio-host $audio --stress-host $stress --run-technical-baseline --timeout 110 --out evidence/lab
          $labExit=$LASTEXITCODE
          [ordered]@{
            validator_exit=$validatorExit
            validator_pass=$validatorPass
            validator_summary=$summary.Value
            test_lab_exit=$labExit
            full_audit='NOT RUN'
            release_approved=$false
          } | ConvertTo-Json | Set-Content evidence/result.json
          if (-not $validatorPass -or $labExit -ne 0) { throw 'Independent gate failed; inspect retained evidence' }
      - name: Retain all independent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CYBERATOR-current-independent-QA
          path: evidence/
          if-no-files-found: error
          retention-days: 14
